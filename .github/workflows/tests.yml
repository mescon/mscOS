name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-aiohttp python3-websockets python3-numpy git ca-certificates
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -t . -v
