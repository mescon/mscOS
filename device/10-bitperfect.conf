# Bit-perfect playback to the Mark Levinson 585.5: Spotify Lossless is 44.1 kHz,
# so lock the graph clock there and never resample.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 1024
    default.clock.max-quantum   = 1024
}

stream.properties = {
    # Resampler never needed (rates match), but if it ever runs, use best quality.
    resample.quality      = 14
    channelmix.normalize  = false
    channelmix.mix-lfe    = false
    channelmix.upmix      = false
    dither.method         = none
    dither.noise          = 0
}
