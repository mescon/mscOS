# mscOS board profile: any board without a profile of its own.
# A profile is KEY="value" lines, read by the boot-time tuning (a shell script) and by the
# panel. /etc/mscos/board.conf links to the profile in use; /etc/mscos/board.local.conf, if
# present, overrides single keys.
#
#   BOARD_NAME      what the streamer is called in the panel (empty: the DMI or device tree name)
#   BOARD_MATCH     regex against the device tree model or DMI "vendor product"; chooses the profile
#   AUDIO_CPU       the core for audio threads and USB interrupts: a number, "last", or empty
#                   for no split (single-core boards)
#   USB_IRQ_MATCH   regex for the USB host controllers in /proc/interrupts
#   CPU_FIXED_KHZ   lock the CPU clock to this frequency (empty: governor performance only)
#   THERMAL_OFF     thermal zone type whose polling is switched off (a sensor that blocks the CPU)
#   NET_SPEED       link speed advertised at boot, 100 or 1000 (empty: leave as is)
#   LEDS            glob under /sys/class/leds for the LEDs the panel may switch off
#   DT_OVERLAY      device tree overlay source in boards/dts to install (Armbian), without .dts
#   DT_OFF_NODE     a node under /proc/device-tree that the overlay disables (to verify it applied)
#   WATCHDOG        systemd RuntimeWatchdogSec (empty: off)
#   USB_PORTS       controller=label;… names for the USB sockets, shown under Signal
#   POWER_BUTTON    "no": the box cannot be started again after a shutdown without cutting its
#                   power (the panel says so before shutting down); empty: it has one, or unknown
#   STORAGE         "sd": the system is on an SD card (the panel's texts say "the SD card")
BOARD_NAME=""
BOARD_MATCH=""
AUDIO_CPU="last"
USB_IRQ_MATCH="[exo]hci[-_]hcd|dwc2|dwc3|dwc_otg"
CPU_FIXED_KHZ=""
THERMAL_OFF=""
NET_SPEED=""
LEDS=""
DT_OVERLAY=""
DT_OFF_NODE=""
WATCHDOG=""
USB_PORTS=""
POWER_BUTTON=""
STORAGE=""
