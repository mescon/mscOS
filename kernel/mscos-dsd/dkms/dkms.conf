# mscOS native DSD for C-Media CM6632A (64-bit raw subslot): a patched snd-usb-audio, built
# for the running kernel. The driver's source is not in the kernel headers, so prepare.sh
# fetches sound/usb of the matching upstream release and applies the patch.
PACKAGE_NAME="mscos-dsd"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="snd-usb-audio"
BUILT_MODULE_LOCATION[0]="usb/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
PRE_BUILD="prepare.sh $kernelver"
MAKE[0]="make -C $kernel_source_dir M=$dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build/usb snd-usb-audio.ko"
CLEAN="rm -rf usb linux-sound-usb"
AUTOINSTALL="yes"
