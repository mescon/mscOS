# The catalogue (modules/index.json) must match the modules: the panel installs from it.
name: modules
on:
  pull_request:
    paths: ["modules/**", "tools/module-index.py"]
  push:
    branches: [main]
    paths: ["modules/**", "tools/module-index.py"]
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/module-index.py --check
      - run: python3 -m compileall -q modules
      # on main the catalogue must carry the maintainer's signature (tools/sign.sh catalogue);
      # a pull request cannot sign, so it is not asked to
      - if: github.event_name == 'push'
        run: MSCOS_KEYS=core/keys core/mscos-verify modules/index.json modules/index.json.sig
