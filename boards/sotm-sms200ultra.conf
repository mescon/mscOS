# SOtM sMS-200 and sMS-200ultra: Allwinner A20 (2 cores) on a Cubietruck-derived board.
# The device tree names the reference board. sMS-200 Neo and SE models are believed to use
# the same board (not verified on a device).
BOARD_NAME="SOtM sMS-200Ultra"
BOARD_MATCH="Cubietech Cubietruck"
AUDIO_CPU="1"
USB_IRQ_MATCH="[eo]hci_hcd:usb"
# As SOtM's own firmware: a fixed 960 MHz, no frequency scaling.
CPU_FIXED_KHZ="960000"
# The A20's GPADC temperature sensor has no working interrupt on this board: every read
# blocks the CPU for about a second (audible dropouts). Temperature comes from the AXP209.
THERMAL_OFF="cpu-thermal"
# Measured on the supply rail: 1.65 W at 1000 Mbit/s, 1.53 W at 100.
NET_SPEED="100"
LEDS="*:usr"
# Hardware the box does not have (HDMI, GPU, SATA, Wi-Fi/Bluetooth, analog codec, ...).
DT_OVERLAY="sotm-lean"
DT_OFF_NODE="soc/hdmi@1c16000"
# A20 hardware watchdog (16 s at most).
WATCHDOG="15s"
POWER_BUTTON="no"
STORAGE="sd"
USB_PORTS="1c1c000.usb=Audio USB;1c1c400.usb=Audio USB;1c14000.usb=USB (hub);1c14400.usb=USB (hub)"
