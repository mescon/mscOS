# USB DAC: pro-audio profile = raw hw: device, no ALSA plugins, no hardware/soft mixer
# tricks; keep it open (no suspend clicks); 32-bit container so 24-bit samples pass intact.
monitor.alsa.rules = [
  {
    # A20 analog codec and HDMI audio are unused: keep them closed.
    matches = [ { device.name = "~alsa_card.platform-*" } ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    matches = [ { device.name = "~alsa_card.usb-*" } ]
    actions = { update-props = { device.profile = "pro-audio" } }
  }
  {
    matches = [ { node.name = "~alsa_output.usb-*" } ]
    actions = {
      update-props = {
        audio.format                   = "S32LE"
        audio.rate                     = 44100
        audio.allowed-rates            = [ 44100 ]
        session.suspend-timeout-seconds = 0
        node.pause-on-idle             = false
        api.alsa.period-size           = 1024
        api.alsa.headroom              = 1024
        api.alsa.disable-tsched        = true
        channelmix.disable             = true
        dither.method                  = "none"
        priority.driver                = 2000
        priority.session               = 2000
      }
    }
  }
]

# Do not restore/remember software volumes: the DAC/amp owns volume.
wireplumber.settings = {
  device.restore-routes = false
  node.stream.restore-props = false
}
